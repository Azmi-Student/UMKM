<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UMKMyu — Detail UMKM</title>
  <meta name="description" content="Detail usaha di UMKMyu — Direktori UMKM Lokal." />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            umkmRed: { DEFAULT: '#ef4444', dark: '#b91c1c' },
            umkmWarm: '#fee2e2',
            umkmText: '#111827',
          },
          fontFamily: { sans: ['Poppins', 'Inter', 'sans-serif'] },
          boxShadow: {
            'soft-lg': '0 10px 30px rgba(17,24,39,0.06)',
            'glow-warm': '0 8px 30px rgba(239,68,68,0.12)'
          }
        }
      }
    };
  </script>

  <style>
    html { scroll-behavior: smooth; }
    body { -webkit-font-smoothing: antialiased; }
    .gradient-text {
      background: linear-gradient(90deg, #ffd4d4, #ef4444 60%, #b91c1c);
      -webkit-background-clip: text; color: transparent;
    }
    .fade-up { animation: fadeUp .6s ease both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body class="bg-white text-umkmText font-sans">

  <!-- HEADER -->
  <header class="fixed inset-x-0 top-0 z-50 bg-white/60 backdrop-blur-md border-b border-white/30">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 md:px-8 flex items-center justify-between h-16">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg flex items-center justify-center bg-gradient-to-br from-umkmRed to-umkmRed-dark text-white shadow-md">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none"><path d="M3 12h18M12 3v18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        <div class="font-bold text-lg md:text-xl"><span class="gradient-text">UMKM</span><span class="italic text-gray-900">yu</span></div>
      </a>
      <a href="index.html" class="px-4 py-2 rounded-full bg-gradient-to-r from-umkmRed to-umkmRed-dark text-white font-semibold shadow-glow-warm hover:opacity-95 transition">Kembali</a>
    </div>
  </header>

  <!-- HERO -->
  <section class="pt-20 pb-12 bg-gradient-to-b from-umkmRed-dark via-umkmRed to-white text-white text-center">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 md:px-8">
      <h1 id="umkmName" class="text-3xl md:text-5xl font-extrabold mb-4 fade-up">Detail UMKM</h1>
      <p id="umkmCategory" class="text-lg text-rose-50 fade-up"></p>
    </div>
  </section>

  <!-- DETAIL CONTENT -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 md:px-8 -mt-10 relative z-10">
    <div class="bg-white rounded-2xl shadow-soft-lg overflow-hidden fade-up">
      <div class="md:flex">
        <!-- Foto -->
        <div class="md:w-1/2">
          <img id="umkmPhoto" src="https://via.placeholder.com/800x500?text=UMKM" alt="Foto UMKM" class="w-full h-full object-cover">
        </div>
        <!-- Info -->
        <div class="md:w-1/2 p-6 md:p-8">
          <h2 id="umkmTitle" class="text-2xl font-bold text-umkmRed-dark mb-2"></h2>
          <span id="umkmCategoryBadge" class="inline-block mb-4 text-sm px-3 py-1 rounded-full bg-umkmWarm text-umkmRed"></span>
          <p id="umkmDesc" class="text-gray-700 mb-6 leading-relaxed"></p>

          <div class="text-sm text-gray-600 mb-4 flex items-center gap-2">
            <svg class="w-5 h-5 text-umkmRed" viewBox="0 0 24 24" fill="none"><path d="M12 2C8 2 5 5 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-4-3-7-7-7z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
            <span id="umkmAddr"></span>
          </div>

          <div class="flex gap-4 mt-6">
            <a href="index.html" class="px-5 py-3 rounded-full bg-white border border-umkmRed text-umkmRed font-semibold shadow-sm hover:bg-umkmWarm transition">← Kembali</a>
            <a id="visitBtn" href="#" target="_blank" rel="noopener" class="px-5 py-3 rounded-full bg-gradient-to-r from-umkmRed to-umkmRed-dark text-white font-semibold shadow-glow-warm hover:opacity-95 transition">Kunjungi UMKM</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- MAP / GALLERY -->
  <section class="max-w-5xl mx-auto px-4 sm:px-6 md:px-8 py-12 fade-up">
    <h3 class="text-xl font-semibold text-umkmRed-dark mb-4">Lokasi UMKM</h3>
    <div id="umkmMap" class="rounded-2xl overflow-hidden shadow-soft-lg">
      <iframe id="mapFrame" src="" class="w-full h-80 border-0" loading="lazy"></iframe>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="bg-gradient-to-r from-umkmRed-dark to-umkmRed text-white py-6 text-center mt-12">
    <p class="text-sm">© 2025 UMKMyu — Dukung Produk Lokal Indonesia</p>
  </footer>

  <!-- SCRIPT -->
  <script>
    // Dummy UMKM data (same as index)
    const data = [
      { id:1, nama:"Warung Bakso Mang Udin", kategori:"makanan", deskripsi:"Bakso legendaris, kuah gurih, bakso homemade. Favorit keluarga.", foto:"https://picsum.photos/seed/bakso/900/600", alamat:"Jl. Merdeka No.10", map:"https://www.google.com/maps?q=Jl.+Merdeka+No.10&output=embed", link:"#"},
      { id:2, nama:"Kedai Kopi Senja", kategori:"minuman", deskripsi:"Kedai cozy dengan kopi robusta lokal dan pastries homemade.", foto:"https://picsum.photos/seed/kopi/900/600", alamat:"Jl. Mawar No.8", map:"https://www.google.com/maps?q=Jl.+Mawar+No.8&output=embed", link:"#"},
      { id:3, nama:"Toko Roti Harapan", kategori:"makanan", deskripsi:"Roti tradisional & kue harian, resep turun-temurun.", foto:"https://picsum.photos/seed/roti/900/600", alamat:"Jl. Anggrek No.12", map:"https://www.google.com/maps?q=Jl.+Anggrek+No.12&output=embed", link:"#"},
      { id:4, nama:"Cukur Cepat Barber", kategori:"jasa", deskripsi:"Pangkas rambut modern & klasik, pelayanan ramah.", foto:"https://picsum.photos/seed/barber/900/600", alamat:"Jl. Melati No.3", map:"https://www.google.com/maps?q=Jl.+Melati+No.3&output=embed", link:"#"},
      { id:5, nama:"Es Krim Nusantara", kategori:"minuman", deskripsi:"Es krim unik rasa tradisional, segar & menyenangkan.", foto:"https://picsum.photos/seed/eskrim/900/600", alamat:"Jl. Kenanga No.7", map:"https://www.google.com/maps?q=Jl.+Kenanga+No.7&output=embed", link:"#"},
      { id:6, nama:"Laundry Kilat Bersih", kategori:"jasa", deskripsi:"Laundry kiloan cepat dan layanan antar-jemput area terdekat.", foto:"https://picsum.photos/seed/laundry/900/600", alamat:"Jl. Sudirman No.21", map:"https://www.google.com/maps?q=Jl.+Sudirman+No.21&output=embed", link:"#"}
    ];

    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get("id"),10);
    const umkm = data.find(u => u.id === id);

    const el = (id) => document.getElementById(id);

    if (umkm) {
      el("umkmName").textContent = umkm.nama;
      el("umkmCategory").textContent = umkm.kategori.toUpperCase();
      el("umkmPhoto").src = umkm.foto;
      el("umkmTitle").textContent = umkm.nama;
      el("umkmCategoryBadge").textContent = umkm.kategori;
      el("umkmDesc").textContent = umkm.deskripsi;
      el("umkmAddr").textContent = umkm.alamat;
      el("visitBtn").href = umkm.link;
      el("mapFrame").src = umkm.map;
    } else {
      document.querySelector("main").innerHTML = `
        <div class="text-center py-16 bg-white rounded-2xl shadow-soft-lg">
          <h2 class="text-2xl font-bold text-umkmRed mb-3">UMKM tidak ditemukan 😢</h2>
          <p class="text-gray-600 mb-6">Data tidak tersedia. Coba kembali ke halaman utama.</p>
          <a href="index.html" class="inline-block px-6 py-3 bg-gradient-to-r from-umkmRed to-umkmRed-dark text-white rounded-full font-semibold shadow-glow-warm">Kembali ke Beranda</a>
        </div>
      `;
    }
  </script>
</body>
</html>
